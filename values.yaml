image:
  repository: stalwartlabs/stalwart
  tag: "v0.16.16"          # tag mineur conseillé par la doc (suit les patchs, pas les breaking)
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

stalwart:
  hostname: "mail.georgeop.us"

  # URL publique (proxy Traefik devant) - publiée dans les discovery documents
  publicUrl: "https://mail.georgeop.us"

  # Compte admin de bootstrap/recovery fixe (évite la pêche au mot de passe dans les logs).
  # Format user:password - via un Secret existant avec la clé RECOVERY_ADMIN.
  # A RETIRER une fois le setup terminé et l'admin permanent créé (cf doc).
  recoveryAdmin:
    existingSecret: "stalwart-recovery"   # kubectl create secret generic stalwart-recovery --from-literal=RECOVERY_ADMIN='admin:UnMotDePasseFort'

  mailPorts:
    smtp: 25
    submissions: 465
    submission: 587
    imaps: 993

  httpPort: 8080

  extraEnv: []

service:
  port: 8080

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: mail.georgeop.us
  tls:
    enabled: true
    secretName: stalwart-http-tls

persistence:
  # /etc/stalwart : la config vivante (wizard/admin UI) - PETIT mais CRITIQUE
  config:
    enabled: true
    storageClass: "local-path"
    accessModes: [ReadWriteOnce]
    size: 1Gi
  # /var/lib/stalwart : data locale - quasi vide si tout est en PostgreSQL,
  # mais requis (RocksDB par défaut tant que le wizard n'a pas basculé sur PG)
  data:
    enabled: true
    storageClass: "local-path"
    accessModes: [ReadWriteOnce]
    size: 10Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# uid 2000 = utilisateur "stalwart" de l'image officielle.
# NE PAS drop NET_BIND_SERVICE: le binaire porte la file capability
# cap_net_bind_service, la retirer fait échouer l'exec (doc officielle).
podSecurityContext:
  fsGroup: 2000

securityContext:
  runAsUser: 2000
  runAsGroup: 2000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "FSETID", "KILL", "SETGID", "SETUID", "SETPCAP", "NET_RAW", "SYS_CHROOT", "MKNOD", "AUDIT_WRITE", "SETFCAP"]
    add: ["NET_BIND_SERVICE"]

livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
